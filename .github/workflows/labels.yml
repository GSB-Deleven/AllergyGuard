# Legt die Labels aus .github/labels.yml an bzw. aktualisiert sie.
name: Labels einrichten

on:
  push:
    branches: [main]
    paths: [".github/labels.yml"]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Labels anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(".github/labels.yml", "utf8").split("\n");
            const out = []; let cur = null;
            for (const l of lines) {
              const m = l.match(/^- name: "(.*)"/); if (m) { cur = { name: m[1] }; out.push(cur); continue; }
              const kv = l.match(/^\s+(color|description): "(.*)"/); if (kv && cur) cur[kv[1]] = kv[2];
            }
            fs.writeFileSync("labels.json", JSON.stringify(out));'
          jq -c '.[]' labels.json | while read -r l; do
            name=$(jq -r .name <<<"$l"); color=$(jq -r .color <<<"$l"); desc=$(jq -r .description <<<"$l")
            gh label create "$name" --color "$color" --description "$desc" --force --repo "$GITHUB_REPOSITORY"
          done
