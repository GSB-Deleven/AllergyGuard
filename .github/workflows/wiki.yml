# Spiegelt docs/wiki/ ins GitHub-Wiki. So liegt die Doku versioniert im Repo
# und wird im selben Pull Request wie der Code aktualisiert.
# Voraussetzung: Wiki eingeschaltet und einmal eine erste Seite angelegt.
name: Wiki aktualisieren

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", "docs/screenshots/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wiki klonen und Seiten kopieren
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude ".git" docs/wiki/ wiki/
          mkdir -p wiki/screenshots && cp docs/screenshots/*.png wiki/screenshots/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "Wiki aus docs/wiki aktualisiert (${GITHUB_SHA::7})"
          git push
