name: "🐞 Fehler in der App"
description: "Etwas funktioniert nicht (Scanner, Foto, Karte …)."
labels: ["bug"]
body:
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Wie kann man es nachstellen?
      placeholder: "1. App öffnen 2. Auf … tippen 3. …"
  - type: input
    id: geraet
    attributes:
      label: Gerät und Browser
      placeholder: "z. B. iPhone 14, iOS 19, vom Home-Bildschirm"
